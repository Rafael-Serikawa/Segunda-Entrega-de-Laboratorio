{% extends 'base.html' %}
{% block content %}
    <h2>{% if post %}Editar Post{% else %}Novo Post{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <a href="{% url 'post_list' %}" class="btn-cancelar">Cancelar</a>
            <button type="submit">Salvar</button>
        </div>
    </form>
{% endblock %}
