{% extends 'base.html' %}
{% block content %}
    <h2>{% if post %}Editar Post{% else %}Novo Post{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <a href="{% url 'post_list' %}">Cancelar</a>
{% endblock %}
