{% extends 'base.html' %}
{% block content %}
    <h2>{{ post.titulo }}</h2>
    <!-- O filtro 'date' é um requisito do laboratório -->
    <p>Postado em: {{ post.data_postagem|date:"d/m/Y H:i" }}</p>
    <hr>
    <div>
        <!-- O filtro 'safe' permite renderizar HTML salvo no banco -->
        {{ post.conteudo|safe }}
    </div>
    <hr>
    <a href="{% url 'post_update' pk=post.pk %}">Editar</a> | 
    <a href="{% url 'post_delete' pk=post.pk %}">Remover</a> |
    <a href="{% url 'post_list' %}">Voltar</a>
{% endblock %}
