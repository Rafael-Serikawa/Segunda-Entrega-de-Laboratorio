{% extends 'base.html' %}
{% block content %}
    <h2>Remover Post</h2>
    <p>Tem certeza que deseja apagar o post "{{ post.titulo }}"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-actions">
            <a href="{% url 'post_list' %}" class="btn-cancelar">Cancelar</a>
            <button type="submit">Confirmar</button>
        </div>
    </form>
{% endblock %}
