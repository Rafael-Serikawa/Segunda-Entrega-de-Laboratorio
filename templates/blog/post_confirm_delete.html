{% extends 'base.html' %}
{% block content %}
    <h2>Remover Post</h2>
    <p>Tem certeza que deseja apagar o post "{{ post.titulo }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, remover</button>
    </form>
    <a href="{% url 'post_detail' pk=post.pk %}">Cancelar</a>
{% endblock %}
