{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Blog</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1><a href="{% url 'post_list' %}">Meu Blog</a></h1>
        <nav>
            <a href="{% url 'post_list' %}">Lista de Posts</a>
            <a href="{% url 'categoria_list' %}">Ver Categorias</a>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
<footer>
    <div style="text-align: center; padding: 20px; background-color: #f4f4f4; color: #666; font-size: 0.9rem; margin-top: 40px; border-top: 1px solid #e0e0e0;">
        <p>&copy; {% now "Y" %} Meu Blog. Todos os direitos reservados.</p>
        <p>Desenvolvido para fins acadêmicos - Laboratório de Sistemas de Informação.</p>
    </div>
</footer>
</html>
